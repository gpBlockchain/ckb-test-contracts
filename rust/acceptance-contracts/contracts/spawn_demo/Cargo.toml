[package]
name = "spawn_demo"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
ckb-std = { git = "https://github.com/nervosnetwork/ckb-std.git", branch = "master", features = ["ckb2023"] }


[[bin]]
name = "spawn_demo"
path = "src/spawn_demo.rs"

[[bin]]
name = "spawn_source_is_input_cell"
path = "src/spawn_source_is_input_cell.rs"

[[bin]]
name = "spawn_source_is_output_cell"
path = "src/spawn_source_is_output_cell.rs"

[[bin]]
name = "spawn_place_is_out_of_range"
path = "src/spawn_place_is_out_of_range.rs"


[[bin]]
name = "spawn_place_is_witness"
path = "src/spawn_place_is_witness.rs"